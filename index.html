<html lang="en-CA" class="scroll-smooth">

    <meta name="theme-color" content="#0A6FE0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    -->

    <title data-seo>AV Group | Grass Cutting, Power Washing &amp; Cleaning in Ottawa</title>

  <body class="bg-white text-[#0B1A2E] antialiased selection:bg-[#0A6FE0] selection:text-white font-sans">
